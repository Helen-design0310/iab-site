<!doctype html>
<html lang="ru" class="is-loading">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ИАБ — дизайн и ремонт</title>
  <meta name="description" content="Дизайн и ремонт отелей, бутиков и ресторанов любой сложности и со сдачей ремонта в надзорные органы.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="fonts/Anticva-Regular.otf" as="font" type="font/otf" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=5">
  <noscript><style>.pre { display: none; } html.is-loading { overflow: auto; }</style></noscript>
</head>
<body>

  <!-- Экран загрузки -->
  <div class="pre" aria-hidden="true">
    <span class="pre__line pre__line--left"></span>
    <span class="pre__line pre__line--center"></span>
    <span class="pre__line pre__line--right"></span>
    <div class="pre__circle">
      <img class="pre__logo" src="img/logo-mark.png" width="477" height="235" alt="">
</div>
    <!-- Тёмная шторка: раскрывается от центра, потом уходит вверх -->
    <div class="pre__curtain"></div>
  </div>

  <!-- Первый экран -->
  <header class="hero">
    <div class="hero__inner">

      <!-- Меню: на десктопе список, на узких экранах бургер -->
      <nav class="nav" aria-label="Основное меню">
        <button class="nav__burger" type="button" aria-expanded="false" aria-controls="menu" aria-label="Открыть меню">
          <span></span><span></span><span></span>
        </button>
        <ul class="nav__list" id="menu">
          <li><a href="#works">Наши работы</a></li>
          <li><a href="#contacts">Контакты</a></li>
          <li><a href="#tariffs">Тарифы</a></li>
          <li><a href="#reviews">Отзывы</a></li>
        </ul>
      </nav>

      <a class="hero__phone" href="tel:+79523487071"><span class="hero__phone-icon" aria-hidden="true"></span>+7 (952) 348-70-71</a>

      <h1 class="hero__title">Дизайн<br>и&nbsp;ремонт<br>под&nbsp;ключ</h1>

      <!-- Видео вместо фото: пропорции 5:7 как у серого прямоугольника в макете -->
      <div class="slider">
        <video class="slider__video" src="video/hero.mp4" width="1080" height="1316" autoplay muted loop playsinline preload="auto" aria-label="Интерьер ресторана"></video>
      </div>

      <div class="offer">
        <p class="offer__subtitle">отелей, бутиков<br>и ресторанов</p>
        <p class="offer__text">любой сложности и&nbsp;со&nbsp;сдачей<br>ремонта в&nbsp;надзорные органы</p>
        <div class="offer__buttons">
          <a class="btn btn--dark" href="#contact">Связаться</a>
        </div>
      </div>

      <div class="logo">
        <img src="img/logo-white.png" width="589" height="130" alt="ИАБ — интерьер атмосферного бизнеса">
      </div>

    </div>
  </header>

  <script src="script.js?v=5"></script>
</body>
</html>
